spring.application.name=user-service
server.port=8081
registry.url=http://localhost:8761

spring.datasource.url=jdbc:mysql://localhost:3306/emptycart_user
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.private-key-path=${JWT_PRIVATE_KEY_PATH}
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH}
jwt.issuer=http://localhost:8081
jwt.access-token-minutes=15
jwt.refresh-token-days=7

admin.email=${ADMIN_EMAIL:admin@emptycart.com}
admin.password=${ADMIN_PASSWORD:admin@123}

#admin stuff
#jwt.issuer=empty-cart-user-service


#logging value:
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] [%X{userId:--}] %logger{30} - %msg%n
